<style>
  :root {
    /* surfaces — light (default) */
    --pl-canvas: #F4F1EA;
    --pl-canvas-2: #EFEBE2;
    --pl-surface: #FFFFFF;
    --pl-surface-2: #FBF9F4;
    --pl-ink: #161A1D;
    --pl-ink-2: #5E6469;
    --pl-ink-3: #9BA1A6;
    --pl-hairline: #ECE7DD;
    --pl-hairline-2: #E3DDD0;
    --pl-on-ink: #F4F1EA;

    /* accent — tweakable */
    --pl-accent: #FF5A3C;
    --pl-accent-deep: #E8442A;
    --pl-accent-tint: #FFEDE7;
    --pl-accent-glow: rgba(255,90,60,0.30);
    --pl-on-accent: #FFFFFF;

    /* discipline tints (fixed) */
    --pl-race:   #1FAFBE;
    --pl-gravel: #C8822E;
    --pl-mtb:    #3E8B5C;
    --pl-gold: #C99A2E;
    --pl-gold-tint: #FBF1D9;

    --pl-r-card: 24px;
    --pl-r-lg: 20px;
    --pl-r-md: 16px;
    --pl-r-sm: 12px;
    --pl-r-pill: 999px;

    --pl-shadow: 0 6px 22px rgba(22,26,29,0.06), 0 1px 3px rgba(22,26,29,0.04);
    --pl-shadow-lg: 0 18px 50px rgba(22,26,29,0.13), 0 3px 8px rgba(22,26,29,0.06);
    --pl-shadow-phone: 0 40px 90px rgba(22,26,29,0.28), 0 8px 24px rgba(22,26,29,0.14);

    --pl-font: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    --pl-container: 1200px;
  }

* { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  html { background-color: var(--pl-canvas); }
  body {
    font-family: var(--pl-font);
    background-color: var(--pl-canvas);
    color: var(--pl-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, h4, p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::selection { background: var(--pl-accent); color: var(--pl-on-accent); }

  #root { overflow-x: clip; position: relative; z-index: 1; }

  .pl-tap { transition: transform .14s cubic-bezier(.2,.7,.2,1), box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease; }
  .pl-tap:active { transform: translateY(1px) scale(0.99); }

  @keyframes pl-rise { from { transform: translateY(16px); } to { transform: none; } }
  @keyframes pl-spin { to { transform: rotate(360deg); } }

  /* Entrance: transform-only so opacity never drops — content is always
     visible (capture-safe, print-safe), just gently rises in. */
  .reveal { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: pl-rise .62s cubic-bezier(.16,1,.3,1) both; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <script src="js/app.js"></script>
</body>
